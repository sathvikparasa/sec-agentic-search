# Builds the workshop images for linux/amd64 + linux/arm64 and pushes them to GHCR:
#   ghcr.io/<owner>/<repo>/py:latest   (dependencies + embedding model; shared by mcp and app)
#   ghcr.io/<owner>/<repo>/db:latest   (Postgres 16 + pgvector + the dataset dump)
#
# The dataset dump is too big for git. The instructor uploads it once to a GitHub release:
#   gh release create data-v1 docker/db/edgar.dump --title "Workshop dataset v1" --notes "pg_dump -Fc"
# and this workflow downloads it before building the db image (DATA_RELEASE below).
#
# After the first push, make both packages public (GitHub > Packages > Package settings) so
# attendees can `docker compose pull` without logging in.

name: images

on:
  push:
    branches: [main]
    paths: [docker/**, requirements.txt, edgar_mcp/embed.py, .github/workflows/images.yml]
  workflow_dispatch:

env:
  DATA_RELEASE: data-v1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [py, db]
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase)
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Download dataset dump
        if: matrix.image == 'db'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DATA_RELEASE" --pattern edgar.dump --dir docker/db --clobber
          ls -lh docker/db/edgar.dump

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.ref }}:latest
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
